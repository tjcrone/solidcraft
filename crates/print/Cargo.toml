[package]
name = "solidcraft-print"
description = "SolidCraft slicing for 3D printing: a Slicer trait and the SlicerX (sx-core) backend behind it"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sx-core = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Per-layer parallelism (rayon) on native builds only; the wasm build slices on one thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sx-core = { workspace = true, features = ["parallel"] }
