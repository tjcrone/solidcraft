# Licences remain covered by `cargo xtask licences --check`.
[advisories]
# The nightly command downgrades only this diagnostic with --warn unmaintained.
unmaintained = "all"
yanked = "warn"

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# solidcore, pinned by rev in Cargo.toml (the kernel behind crates/smlib), and SlicerX's slicing
# engine (sx-core), which is not on crates.io.
allow-git = ["https://github.com/tangency-labs/solidcore", "https://github.com/slicerx-oss/slicerx", "https://github.com/tjcrone/slicerx"]
